<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clocktower Notebook</title>
<meta name="description" content="Blood on the Clocktower notebook, Demon odds solver, Storyteller helper and a full Trouble Brewing game against computer players.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt=""><span>Clocktower</span></div>
  <div class="head-mid" id="headMid"></div>
  <button class="iconbtn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<div class="shell">
  <main>
    <section class="view" id="v-town"></section>
    <section class="view" id="v-odds"></section>
    <section class="view" id="v-play"></section>
    <section class="view" id="v-st"></section>
    <section class="view" id="v-roles"></section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-tab="town"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4" r="2"/><circle cx="19" cy="9" r="2"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/><circle cx="5" cy="9" r="2"/></svg>Town</button>
    <button data-tab="odds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Odds</button>
    <button data-tab="play" class="hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z"/></svg>Play</button>
    <button data-tab="st"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13v2H6"/><path d="M9 8h6M9 12h4"/></svg>Grimoire</button>
    <button data-tab="roles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Roles</button>
  </nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<script src="js/roles.js?v=5"></script>
<script src="js/art.js?v=5"></script>
<script src="js/solver.js?v=5"></script>
<script src="js/engine.js?v=5"></script>
<script src="js/bots.js?v=5"></script>
<script src="js/ctonline.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script type="module">import { createOnline } from './js/online.js?v=5'; window.CTOnlineLib = { createOnline }; window.dispatchEvent(new Event('ct-online-ready'));</script>
</body>
</html>
